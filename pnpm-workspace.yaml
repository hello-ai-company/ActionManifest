packages:
  - "packages/*"
  - "apps/*"
  - "integration/*"

# pnpm 11+: build allowlist lives here (onlyBuiltDependencies was removed).
allowBuilds:
  esbuild: true

# pnpm 11 supply-chain default: newly published versions are blocked for 24h
# (minimumReleaseAge). The reviewed, exactly-pinned Xberg 1.1.3 set
# (ADR 0007) is excluded so CI does not flap on its publish timestamp.
minimumReleaseAgeExclude:
  - "@xberg-io/xberg@1.1.3"
  - "@xberg-io/xberg-darwin-arm64@1.1.3"
  - "@xberg-io/xberg-linux-arm64-gnu@1.1.3"
  - "@xberg-io/xberg-linux-arm64-musl@1.1.3"
  - "@xberg-io/xberg-linux-x64-gnu@1.1.3"
  - "@xberg-io/xberg-linux-x64-musl@1.1.3"
  - "@xberg-io/xberg-win32-x64-msvc@1.1.3"
