name: Release Check

# Verification-only release gate. This workflow NEVER publishes: it holds no
# registry credentials (NPM_TOKEN/NODE_AUTH_TOKEN are explicitly empty), has
# no id-token permission, pushes no tags, and creates no GitHub Releases.
#
# Canonical model: BUILD ONCE on ubuntu + Node >= 22 + pnpm 11.23.0.
# Node 20 consumer proof and Node 22+ Xberg native proof consume THAT
# artifact — they never rebuild tarballs.
#
# Path split:
#   - pull_request: quick path — `pnpm release:check:quick`
#   - push to main, tags, workflow_dispatch: `pnpm release:check`

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  NPM_TOKEN: ""
  NODE_AUTH_TOKEN: ""

jobs:
  canonical-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version comes from package.json "packageManager" (do not also set `version` here).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Canonical pack lane: pnpm 11.23.0 requires Node >= 22 to EXECUTE.
          # Consumer floor is unchanged (engines.node >= 20; adapter-xberg >= 22).
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release quick check (PR path)
        if: github.event_name == 'pull_request'
        run: pnpm release:check:quick
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Release full check (main / tag / dispatch path)
        if: github.event_name != 'pull_request'
        run: pnpm release:check
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Upload canonical release-check artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-check-${{ github.sha }}
          path: |
            release-artifacts/tarballs/*.tgz
            release-artifacts/SHA256SUMS
            release-artifacts/release-manifest.json
            release-artifacts/sbom.cdx.json
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

  consumer-node20:
    name: Node20 consumer proof (npm, canonical artifact)
    needs: canonical-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # npm only — no pnpm/action-setup, no package-manager cache. Node 20
      # proves packed artifacts the way a consumer installs them.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-check-${{ github.sha }}
          path: .
      - name: Verify SHA256SUMS (cwd-independent; bare names + tarballs/)
        run: node scripts/verify-sha256sums.mjs release-artifacts
      - name: Node 20 consumer smoke from local tarballs (exclude adapter-xberg)
        run: node scripts/consumer-artifact-smoke.mjs --artifacts release-artifacts

  xberg-node22:
    name: Node22 Xberg native gate (canonical artifact)
    needs: canonical-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-check-${{ github.sha }}
          path: .
      - name: Xberg native smoke (2/2 synthetic fixtures, canonical tarball)
        run: node scripts/xberg-artifact-smoke.mjs --artifacts release-artifacts
