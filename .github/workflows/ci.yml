name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (do not also set `version` here).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure esbuild binary
        run: node node_modules/esbuild/install.js
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm schema:validate
      - run: pnpm test
      - run: pnpm benchmark:smoke
